name: Goggle 3 LiveView Multi issue
description: Report a problem with the Multi app for Mac or Windows.
title: "[Multi] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Multi. Do not include serial numbers or private information. This form is for Multi, the app separate from the original viewer."
  - type: input
    id: version
    attributes:
      label: Multi version and language
      placeholder: "Windows 0.5.0, English / Mac 0.4.1, English"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Computer model and operating system
      placeholder: "Intel / AMD PC, Windows 11... or MacBook Air M2, macOS..."
    validations:
      required: true
  - type: input
    id: goggles
    attributes:
      label: Goggles and USB connection
      description: "Number of Goggles 3, firmware if known, direct connection or hub model. No serial numbers."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
      description: "Describe what you expected, what happened and whether you were recording a channel or the mosaic. Screenshots must not contain private information."
    validations:
      required: true
